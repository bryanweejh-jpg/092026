<!DOCTYPE html>
<html>
<head>
<title>Activity 10</title>
<link rel=icon href=picture.png type=image/png>

<script>
function validateForm(){

//to validate text - do not allow empty
let x = document.MyFirstForm.fname.value;
if(x==""){
alert("Please provide your First Name!");
return false;
}

//to validate text - only allow alphabet characters
let y = document.MyFirstForm.lname.value;
var letters = /^[A-Za-z]/;
if(!y.match(letters)){
alert("Please input alphabet characters for Last Name.");
return false;
}

//to validate radio - do not allow empty
if((MyFirstForm.gender[0].checked == false) && (MyFirstForm.gender[1].checked == false)){
alert("please choose Gender: Male or Female");
return false;
}

//to validate checkbox - do not allow empty
 let anyChecked = document.querySelector('input[name="fav_sub"]:checked');
  if (!anyChecked) {
    alert("Please check at least one checkbox for favorite subjects!");
    return false;
}
}
</script>

<meta name=viewport content=width=device-width,initial-scale=1.0>
</head>

<body topmargin=50>


<center>
<form name=MyFirstForm onsubmit="return validateForm()">
<table style="background-color:powderblue;
color:#696969; font-family:verdana;
font-size:140%;
text-align:left;
width:70%; height:40%;">
<tr>
<td align=center colspan=2><br>Personal details:</td></tr>
<tr>
<td>First Name:</td>
<td><input type=text name=fname size=50 maxlength=10></td>
</tr><br>
<tr>
<td>Last Name:</td>
<td><input type=text name=lname placeholder='Last Name' autofocus></td>
</tr>

<tr>
<td>Gender:</td>
<td>
<input type=radio name=gender value=Male>Male
<input type=radio name=gender value=Female>Female</td>
</tr>

<tr>
<td>Choose your favorite subjects:</td>
<td>
<input type=checkbox name=fav_sub value=DCS4103 checked>DCS4103

<input type=checkbox name=fav_sub value=DCS3003 disabled>DCS3003

<input type=checkbox name=fav_sub value=DCS1003>DCS1003

<input type=checkbox name=fav_sub value=MST2003>MST2003</td>

</tr>

<tr>
<td>Address:</td>
<td>
<textarea rows=4 cols=30 name=address></textarea></td>
</tr>

<tr>
<td>Date of Birth:</td>
<td>
<input type=date name=dob min=2000-01-01 max=2005-12-31></td>
</tr>

<tr>
<td>Login password:</td>
<td>
<input type=password name=loginpass readonly></td>
</tr>

<tr>
<td>Course:</td>
<td>
<select>
<option value=0>-List of Courses-</option>
<optgroup label="Diploma in Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>
<option value=DIB>Diploma in Business</option>
<option value=DAS>Diploma in Airline Services</option>
</select>
</tr>


<tr>
<td colspan=2 align=center>
<input type=submit value=Submit>
<input type=reset value=Reset>
<br>
</td></tr>
</center>
</form>

</body>
</html>
