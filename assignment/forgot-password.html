<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Cast &amp; Reel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <div class="stage">

      <!-- Top left: fishing rod -->
      <aside class="panel panel--rod">
        <img src="images/rod.svg" alt="Fishing rod with reel and bobber">
      </aside>

      <!-- Top centre: website title -->
      <header class="title">
        <h1><a href="main.html">Cast &amp; Reel</a></h1>
        <p>Rods and lures</p>
      </header>

      <!-- Top right: fishing boat -->
      <aside class="panel panel--boat">
        <img src="images/boat.svg" alt="Fishing boat with two rods">
      </aside>

      <!-- Centre: forgot password card -->
      <main class="zone">
        <section class="card">

          <!-- STEP 1: look up the account by email -->
          <div id="stepEmail">
            <h2>Forgot Password?</h2>

            <p class="description">
              Don't worry! Enter the email address associated with your
              account and we'll help you reset your password.
            </p>

            <div id="banner" class="banner" role="status" aria-live="polite"></div>

            <form id="resetForm" novalidate>
              <div class="field">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">
                <p class="err" id="emailErr"></p>
              </div>

              <button type="submit" class="primary" id="submitBtn">
                Reset password
              </button>
            </form>
          </div>

          <!-- STEP 2: account found, only the password can be changed -->
          <div id="stepPassword" hidden>
            <h2>Reset password</h2>

            <p class="description">
              We found your account. Choose a new password below.
              Your username and email stay the same.
            </p>

            <div id="banner2" class="banner" role="status" aria-live="polite"></div>

            <form id="newPassForm" novalidate>
              <div class="field">
                <label for="ruser">Username</label>
                <input type="text" id="ruser" name="username" readonly autocomplete="username">
              </div>

              <div class="field">
                <label for="remail">Email</label>
                <input type="text" id="remail" name="email" inputmode="email" readonly autocomplete="email" autocapitalize="none" spellcheck="false">
              </div>

              <div class="field">
                <label for="newPassword">New password</label>
                <div class="input-wrap">
                  <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
                  <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
                <p class="err" id="newPasswordErr"></p>
              </div>

              <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
                <p class="err" id="confirmPasswordErr"></p>
              </div>

              <button type="submit" class="primary" id="saveBtn">
                Save new password
              </button>
            </form>
          </div>

        </section>

        <a class="create" href="login.html">Back to sign in</a>
      </main>

    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const stepEmail = document.getElementById('stepEmail');
    const stepPassword = document.getElementById('stepPassword');

    /* ---------- STEP 1: email lookup ---------- */
    const form = document.getElementById('resetForm');
    const emailEl = document.getElementById('email');
    const emailErr = document.getElementById('emailErr');
    const banner = document.getElementById('banner');
    const btn = document.getElementById('submitBtn');

    function showEmailError(message) {
      emailErr.textContent = message;
      emailEl.classList.toggle('invalid', !!message);
      emailEl.setAttribute('aria-invalid', message ? 'true' : 'false');
    }

    function showBanner(el, type, message) {
      el.className = 'banner show ' + type;
      el.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      banner.className = 'banner';
      showEmailError('');

      const email = emailEl.value.trim();

      if (!email) {
        showEmailError('Enter your email address.');
        emailEl.focus();
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showEmailError('That email address doesn\u2019t look right.');
        emailEl.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Checking...';

      try {
        // DEMO ONLY: compares against accounts saved in this browser.
        // On a real site, do this check (and the reset) on your server.
        await new Promise(resolve => setTimeout(resolve, 400));

        const account = TT.findByEmail(email);

        if (!account) {
          showBanner(banner, 'error',
            'No account with that email was found. Check the address or create a new account.');
          return;
        }

        // Match found: switch to the password-only form, autofilled
        document.getElementById('ruser').value = account.username;
        document.getElementById('remail').value = account.email;
        stepEmail.hidden = true;
        stepPassword.hidden = false;
        document.getElementById('newPassword').focus();
      } catch (error) {
        showBanner(banner, 'error', 'Something went wrong. Please try again later.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });

    /* ---------- STEP 2: set new password ---------- */
    const passForm = document.getElementById('newPassForm');
    const banner2 = document.getElementById('banner2');
    const saveBtn = document.getElementById('saveBtn');
    const newPassEl = document.getElementById('newPassword');
    const confirmEl = document.getElementById('confirmPassword');
    const toggle = document.getElementById('toggle');

    toggle.addEventListener('click', () => {
      const show = newPassEl.type === 'password';
      newPassEl.type = show ? 'text' : 'password';
      confirmEl.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(show));
    });

    function setError(input, errId, msg) {
      document.getElementById(errId).textContent = msg;
      input.classList.toggle('invalid', !!msg);
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    }

    passForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner2.className = 'banner';
      setError(newPassEl, 'newPasswordErr', '');
      setError(confirmEl, 'confirmPasswordErr', '');

      const p = newPassEl.value;
      const c = confirmEl.value;

      if (!p) {
        setError(newPassEl, 'newPasswordErr', 'Enter a new password.');
        newPassEl.focus();
        return;
      }
      if (p.length < 8) {
        setError(newPassEl, 'newPasswordErr', 'Passwords are at least 8 characters.');
        newPassEl.focus();
        return;
      }
      if (c !== p) {
        setError(confirmEl, 'confirmPasswordErr', 'Passwords don\u2019t match.');
        confirmEl.focus();
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving\u2026';

      try {
        const username = document.getElementById('ruser').value;
        const email = document.getElementById('remail').value;

        // Overwrites the existing account instead of creating a new one
        await TT.resetAccount(email, username, email, p);

        showBanner(banner2, 'success', 'Password updated. Taking you to sign in\u2026');
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      } catch (err) {
        showBanner(banner2, 'error',
          err.code === 'storage'
            ? 'Couldn\u2019t save your password. Check that browser storage is enabled.'
            : 'Something went wrong. Please start again.');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save new password';
      }
    });
  </script>
</body>
</html>
