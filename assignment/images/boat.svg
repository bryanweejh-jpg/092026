<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Fishing boat with two rods" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- outrigger rods and lines -->
  <line x1="118" y1="82" x2="182" y2="46" stroke="#0e2530" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="82" x2="18" y2="50" stroke="#0e2530" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M182 46 V158" stroke="#0e2530" stroke-width="1.2" fill="none"/>
  <path d="M18 50 V158" stroke="#0e2530" stroke-width="1.2" fill="none"/>
  <!-- mast and flag -->
  <line x1="118" y1="128" x2="118" y2="58" stroke="#0e2530" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M118 58 L136 64 L118 70Z" fill="#d8452f"/>
  <!-- cabin -->
  <rect x="62" y="98" width="44" height="32" rx="3" fill="#eaf0ee" stroke="#0e2530" stroke-width="2.5"/>
  <rect x="70" y="106" width="12" height="11" rx="2" fill="#1b5e6b"/>
  <rect x="88" y="106" width="12" height="11" rx="2" fill="#1b5e6b"/>
  <!-- hull -->
  <path d="M28 128 H172 L154 164 Q151 169 145 169 H55 Q49 169 46 164 Z" fill="#d8452f" stroke="#0e2530" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 142 H164" stroke="#eaf0ee" stroke-width="4"/>
  <!-- water -->
  <path d="M6 172 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#1b5e6b" stroke-width="3" stroke-linecap="round"/>
  <path d="M6 186 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#1b5e6b" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
</svg>
