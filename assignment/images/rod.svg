<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Fishing rod with reel and bobber" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- handle and rod blank -->
  <line x1="28" y1="182" x2="62" y2="142" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/>
  <line x1="62" y1="142" x2="172" y2="22" stroke="#0e2530" stroke-width="4" stroke-linecap="round"/>
  <!-- reel -->
  <line x1="68" y1="138" x2="80" y2="143" stroke="#0e2530" stroke-width="3"/>
  <circle cx="84" cy="148" r="13" fill="#eaf0ee" stroke="#0e2530" stroke-width="3"/>
  <circle cx="84" cy="148" r="5" fill="#1b5e6b"/>
  <!-- line guides -->
  <circle cx="107" cy="94" r="3.5" fill="none" stroke="#0e2530" stroke-width="1.8"/>
  <circle cx="136" cy="62" r="3.5" fill="none" stroke="#0e2530" stroke-width="1.8"/>
  <circle cx="158" cy="38" r="3.5" fill="none" stroke="#0e2530" stroke-width="1.8"/>
  <!-- fishing line -->
  <path d="M172 22 Q190 72 150 118" fill="none" stroke="#0e2530" stroke-width="1.3"/>
  <!-- bobber -->
  <circle cx="150" cy="126" r="8" fill="#eaf0ee" stroke="#0e2530" stroke-width="2"/>
  <path d="M142 126 a8 8 0 0 1 16 0Z" fill="#d8452f"/>
  <!-- hook -->
  <path d="M150 134 v16 q0 9 -8 7" fill="none" stroke="#0e2530" stroke-width="1.8" stroke-linecap="round"/>
</svg>
