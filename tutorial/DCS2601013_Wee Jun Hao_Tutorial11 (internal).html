<!DOCTYPE html>
<html>
<head>
<title>Heading Element</title>
<link rel=icon href=picture.png type=image/png>
<meta name=viewport content=width=device-width,initial-scale=1.0>

<style>
body{
height:1000px;}

h1{
display:inline-block;
rotate:-20deg;
position:sticky;
top:0;
padding:25px;
opacity:0.6;}

.p1{
line-height:1.5px;}

.p2{
width:fit-content;
cursor:pointer;}

.f1{
outline:3px solid darkblue;}
</style>
</head>

<body>

<!--Puts h1 into an inline block, rotates it by -20 degrees, 
allows the word JavaScript to follow when scrolling, and changes opacity to 0.6-->

<h1>JavaScript</h1>

<!--Adds an outline on the words-->
<p class="p1"><font class="f1">JavaScript</font> is a scripting or programming language that allows you to implement features on web pages.
</p>

<!--Auto resize any background to content-->
<p class="p2">
  JavaScript's widespread applications in web, mobile app, and game development make it a valuable language to learn.
</p>


</body>
</html>
