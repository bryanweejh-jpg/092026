<!DOCTYPE html>
<html>
<head>
<title>Tutorial Lesson 17</title>
<link rel=icon href=picture.png type=image/png>
<meta name=viewport content=width=device-width,initial-scale=1.0>

<script>
function rowone(){
alert("Row-1 Col-1 clicked")
}

function coltwo(){
alert("Row-1 Col-2 hovered")
}

function colthree(){
alert("Row-1 Col-3 doubleclicked")
}

function colfour(x){
alert("Row-1 Col-4 clicked. Changed background")
x.style.backgroundColor="lightblue";
}
</script>

</head>

<body topmargin=20 leftmargin=50>
<table border=3 width=60% and height=500px align=center>

<caption>My First Web Table<br><br></caption>


<tr>
<th>header one</th>
<th>header two</th>
<th>header three</th>
<th>header four</th>
</tr>

<tr>
<td onclick="rowone()">data row1-col1</td>
<td onmouseover="coltwo()">data row1-col2</td>
<td ondblclick="colthree()">data row1-col3</td>
<td onclick="colfour(this)">data row1-col4</td>
</tr>

<tr>
<td>data row2-col1</td>
<td>data row2-col2</td>
<td>data row2-col3</td>
<td>data row2-col4</td>
</tr>

<tr>
<td>data row3-col1</td>
<td>data row3-col2</td>
<td>data row3-col3</td>
<td>data row3-col4</td>
</tr>
</table>

</body>
</html>
